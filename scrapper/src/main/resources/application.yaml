server:
  port: 8081

spring:
  jackson:
    time-zone: UTC
  application:
    name: scrapper
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scrapper}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:migrations/db.changelog-master.yaml
    enabled: true
  data:
    redis:
      client-type: lettuce
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:2s}
      timeout: ${VALKEY_READ_TIMEOUT:2s}
      repositories:
        enabled: false
      cluster:
        nodes: ${VALKEY_CLUSTER_NODES:localhost:7000,localhost:7001,localhost:7002}
        max-redirects: ${VALKEY_CLUSTER_MAX_REDIRECTS:3}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: ${VALKEY_CLUSTER_REFRESH_PERIOD:30s}

app:
  scheduler:
    interval: 1m
    batch-size: 100
    parallelism: 4
  bot:
    base-url: http://localhost:8080
  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com/2.3
    site: stackoverflow
    filter: withbody
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN}
    per-page: 100
    issues-state: all
    issues-sort: created
    issues-direction: desc
  database:
    access-type: ${ACCESS_TYPE:SQL}
  notification:
    preview-length: 200
    transport: ${NOTIFICATION_TRANSPORT:KAFKA}
  kafka:
    topic:
      link-updates: link-updates
      link-updates-dlq: link-updates-dlq
      partitions: 3
      replication-factor: 3
      min-in-sync-replicas: 2
  cache:
    links:
      enabled: ${LINK_LIST_CACHE_ENABLED:true}
      ttl: ${LINK_LIST_CACHE_TTL:10m}
