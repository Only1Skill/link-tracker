server:
  port: 8081

spring:
  jackson:
    time-zone: UTC
  application:
    name: scrapper
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scrapper}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:migrations/db.changelog-master.yaml
    enabled: true
  data:
    redis:
      client-type: lettuce
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:2s}
      timeout: ${VALKEY_READ_TIMEOUT:2s}
      repositories:
        enabled: false
      cluster:
        nodes: ${VALKEY_CLUSTER_NODES:localhost:7000,localhost:7001,localhost:7002}
        max-redirects: ${VALKEY_CLUSTER_MAX_REDIRECTS:3}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: ${VALKEY_CLUSTER_REFRESH_PERIOD:30s}

app:
  scheduler:
    interval: 1m
    batch-size: 100
    parallelism: 4
  bot:
    base-url: http://localhost:8080
  stackoverflow:
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    base-url: https://api.stackexchange.com/2.3
    site: stackoverflow
    filter: withbody
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN}
    per-page: 100
    issues-state: all
    issues-sort: created
    issues-direction: desc
  database:
    access-type: ${ACCESS_TYPE:SQL}
  notification:
    preview-length: 200
    transport: ${NOTIFICATION_TRANSPORT:KAFKA}
  kafka:
    topic:
      link-updates: link-updates
      link-updates-dlq: link-updates-dlq
      partitions: 3
      replication-factor: 3
      min-in-sync-replicas: 2
  cache:
    links:
      enabled: ${LINK_LIST_CACHE_ENABLED:true}
      ttl: ${LINK_LIST_CACHE_TTL:10m}
  resilience:
    timeout:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:2s}
    retry:
      max-attempts: ${HTTP_RETRY_MAX_ATTEMPTS:3}
      wait-duration: ${HTTP_RETRY_WAIT_DURATION:200ms}
      retryable-statuses: ${HTTP_RETRYABLE_STATUSES:500,502,503,504}
    circuit-breaker:
      sliding-window-size: ${HTTP_CB_SLIDING_WINDOW_SIZE:10}
      minimum-number-of-calls: ${HTTP_CB_MINIMUM_NUMBER_OF_CALLS:5}
      failure-rate-threshold: ${HTTP_CB_FAILURE_RATE_THRESHOLD:100}
      permitted-number-of-calls-in-half-open-state: ${HTTP_CB_HALF_OPEN_CALLS:5}
      wait-duration-in-open-state: ${HTTP_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    limit-for-period: ${RATE_LIMIT_FOR_PERIOD:60}
    limit-refresh-period: ${RATE_LIMIT_REFRESH_PERIOD:1m}
