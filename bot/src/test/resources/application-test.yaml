app:
  telegram:
    url: ${wiremock.server.baseUrl}/bot
    token: test-token
    update-listener-sleep: 1s
    debug: true
  kafka:
    enabled: false

  resilience:
    timeout:
      connect-timeout: 100ms
      read-timeout: 500ms
    retry:
      max-attempts: 3
      wait-duration: 50ms
      retryable-statuses: 500,502,503,504
    circuit-breaker:
      sliding-window-size: 4
      minimum-number-of-calls: 2
      failure-rate-threshold: 100
      permitted-number-of-calls-in-half-open-state: 2
      wait-duration-in-open-state: 200ms
  rate-limiting:
    enabled: false
    limit-for-period: 100
    limit-refresh-period: 1s
