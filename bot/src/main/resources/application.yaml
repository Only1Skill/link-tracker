server:
  port: 8080

spring:
  application:
    name: bot
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: bot-link-updates
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.LongDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: backend.academy.linktracker.dto.LinkUpdate
        spring.json.trusted.packages: backend.academy.linktracker.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN}
    update-listener-sleep: 1s
    debug: false
  scrapper:
    base-url: http://localhost:8081
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      link-updates: link-updates
      link-updates-dlq: link-updates-dlq
      partitions: 3
      replication-factor: 3
      min-in-sync-replicas: 2
    consumer:
      retry-attempts: 3
      retry-interval: 1s
  resilience:
    timeout:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:2s}
    retry:
      max-attempts: ${HTTP_RETRY_MAX_ATTEMPTS:3}
      wait-duration: ${HTTP_RETRY_WAIT_DURATION:200ms}
      retryable-statuses: ${HTTP_RETRYABLE_STATUSES:500,502,503,504}
    circuit-breaker:
      sliding-window-size: ${HTTP_CB_SLIDING_WINDOW_SIZE:10}
      minimum-number-of-calls: ${HTTP_CB_MINIMUM_NUMBER_OF_CALLS:5}
      failure-rate-threshold: ${HTTP_CB_FAILURE_RATE_THRESHOLD:100}
      permitted-number-of-calls-in-half-open-state: ${HTTP_CB_HALF_OPEN_CALLS:5}
      wait-duration-in-open-state: ${HTTP_CB_WAIT_DURATION_IN_OPEN_STATE:1s}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    limit-for-period: ${RATE_LIMIT_FOR_PERIOD:60}
    limit-refresh-period: ${RATE_LIMIT_REFRESH_PERIOD:1m}
